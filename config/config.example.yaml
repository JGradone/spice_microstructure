# Processing configuration template.
# Copy to config/config.yaml and set local paths. Every parameter that affects
# results lives here; scripts must not hard code values.
# Values marked TODO must be filled before the baseline run (see
# docs/shipboard_processing.md for the shipboard values).

run:
  name: baseline                  # short label written into output metadata
  notes: "Baseline: all VMP casts from raw on the pinned package version with shipboard parameters."
  instruments: [vmp250, vmp5500]  # which entries of `instruments` to process

paths:
  # Cruise event log (Sealog export, read only). Directory holds one file.
  sealog_dir: /path/to/SPICE_turbulence/sealog
  sealog_file: FKt260806_sealog_export.csv
  # Rockland shear probe calibration sheets and FP07 production reports (read only)
  probe_calsheets: /path/to/SPICE_turbulence/SpiceProbeCalSheets
  # Ship CTD (SBE 911, 103 casts, 1 m grid to 550 m), read only. Reference for
  # VMP stratification and the salinity source for the VMP5500.
  ship_ctd: /path/to/SPICE_ctd/SPICE_2026_08_FKt260806_CTD_v1_20260901.nc
  # Where this pipeline writes its outputs. Relative paths are inside this
  # repository; .gitignore decides what is committed. Never point this at the
  # data directories (archives, or the earlier shipboard-era code and figures).
  output_root: outputs

manifests:
  sealog: manifests/sealog.sha256.csv
  probe_calsheets: manifests/probe_calsheets.sha256.csv
  ship_ctd: manifests/ship_ctd.sha256.csv
  verify_before_run: true         # instrument archive manifests are listed per instrument

cast_log:
  # Build a cast table (instrument, file, start time from the .p header,
  # position, probe serials, station, notes, flags) and a ship track from the
  # Sealog export. Match Sealog VMP events to files by .p header start time,
  # not by the logged file name: several names are mistyped and some times are
  # wrong (see docs/shipboard_processing.md, "Sealog cross check").
  match_window_min: 15            # max |Sealog ts - file start| for a match
  track_events: [ASNAP]           # events whose ship lat/lon form the track
  process_station:                # 48 h station, both instruments
    center_lat: 11.626
    center_lon: -50.577
    start_utc: "2026-08-19T22:30:00Z"
    end_utc: "2026-08-21T19:30:00Z"

instruments:
  # Excluded casts and probes are still processed and logged with their
  # reason, and flagged in the products; they are never silently dropped.

  vmp250:
    model: VMP-250IR
    serial: "537"
    sealog_platform: VMP250       # event_option.platform value in the Sealog
    salinity_source: own          # JAC CT salinity agrees with the ship CTD (decisions.md)
    sensor_offsets_m:             # sensor depth minus pressure-sensor depth (+ = deeper)
      ct: 0.0                     # JAC CT: not yet confirmed
      microstructure: 0.0         # shear/FP07 probe tips: not yet confirmed
    archive_raw: /path/to/SPICE_turbulence/vmp250_raw
    archive_patched: /path/to/SPICE_turbulence/vmp250_patched
    archive_processed: /path/to/SPICE_turbulence/vmp250_processed
    file_pattern: "data_*.p"
    manifests:
      raw: manifests/vmp250_raw.sha256.csv
      patched: manifests/vmp250_patched.sha256.csv
      processed: manifests/vmp250_processed.sha256.csv
    archive_generation: "01"      # vmp250_processed/*_01: last shipboard-parameter run (2026-09-30)
    process_station_files: [data_0132.p, data_0133.p, data_0134.p]
    perturb_overrides: {}         # VMP250 uses the shared perturb block as is (JAC CT)
    towyo: [data_0134.p]          # Tow-yo lines 1 and 2, 2026-08-20, ship under way
    exclude: {}                   # e.g. {data_0112.p: "test casts, sh2 probe M3463"}
    exclude_probes:               # keys: a file (all profiles) or a profile stem (that profile only)
      data_0112.p: [sh2]          # test casts, sh2 M3463: e1/e2 0.08 and 0.18 on profiles 1-2 (decisions.md 2026-10-13)
      data_0123_prof004: [sh2]    # sh2 3-5x LOW vs sh1 and neighbouring casts (sh1 normal); profiles 1-3 agree
      data_0124.p: [sh2]          # sh2 3-5x low (damped response; sargassum logged), sh1 matches neighbours
    patch:
      # Written into each raw file's config record with rsi-tpw patch-config.
      # Probe history from the Sealog; sens and dates from the cal sheets.
      # FP07 probes are uncalibrated at the factory (calibrated in situ).
      # The shipboard patch applied M2662 to every file, but data_0112.p was
      # recorded with M3463 on sh2.
      method: rsi-tpw patch-config
      author: "Joe"
      ranges:                     # applied to files first..last inclusive
        - first: data_0112.p
          last: data_0112.p
          sh1: {sn: M3464, sens: "0.1215", cal_date: "2026-04-07"}
          sh2: {sn: M3463, sens: "0.1079", cal_date: "2026-04-07"}
          T1: {sn: T3306}
          T2: {sn: T3308}
        - first: data_0113.p
          last: data_0149.p
          sh1: {sn: M3464, sens: "0.1215", cal_date: "2026-04-07"}
          sh2: {sn: M2662, sens: "0.1134", cal_date: "2023-04-12"}   # 3.5 yr old calibration
          T1: {sn: T3306}
          T2: {sn: T3308}

  vmp5500:
    # Same instrument as "VMP6000" in directory names.
    model: VMP-5500
    serial: "010"
    sealog_platform: VMP5500
    salinity_source: own_ts       # SBC1 conductivity too noisy for gradients; salinity from
                                  # the cast's own T-S relation at FP07 temperature (hydrography.own_ts)
    sensor_offsets_m:             # sensor depth minus pressure-sensor depth (+ = deeper)
      ct: -1.57                   # SBE3/SBE4 1.57 m above the pressure sensor (user, 2026-10-13)
      microstructure: 0.30        # shear/FP07 probe tips ~1 ft below the pressure sensor (user, 2026-10-13)
    ct_match:                     # SBE3 temperature slowed to match the SBE4 cell before computing salinity (own_ts)
      delay_s: 0.25               # SBE4 delay relative to SBE3 (cruise median of the response fit)
      tau_s: 6.0                  # extra first-order lag on SBE3 T (s); zeroes the T-S offset vs ship CTD
    archive_raw: /path/to/SPICE_turbulence/vmp6000_raw
    archive_patched: /path/to/SPICE_turbulence/vmp6000_patched
    archive_processed: /path/to/SPICE_turbulence/vmp6000_processed
    file_pattern: "SPC_*.P"
    manifests:
      raw: manifests/vmp6000_raw.sha256.csv
      patched: manifests/vmp6000_patched.sha256.csv
      processed: manifests/vmp6000_processed.sha256.csv
    archive_generation: "00"      # only generation in vmp6000_processed
    process_station_files: [SPC_033.P, SPC_034.P, SPC_038.P, SPC_039.P]
    perturb_overrides:            # VMP5500 carries a Sea-Bird CT, not a JAC CT (shipboard params)
      ct: {T_name: SBT1, C_name: SBC1}
      fp07: {reference: SBT1, reference_interval: 0.015625}   # SBT1 is a native 64 Hz slow channel
      ctd: {T_name: SBT1, C_name: SBC1}
    towyo: []
    exclude:
      SPC_003.P: "bench test with test probes; placeholder calibrations; clock set incorrectly"
    exclude_probes:
      # T2 (T3304) chi 1.7x T1 at signal/noise > 100 from SPC_012 to SPC_039 (0.95 on SPC_004),
      # i.e. a gain error, not noise; T1 agrees with the replacement T3301 (0.98). T3304
      # flat-lined on SPC_040 and was replaced (decisions.md 2026-10-13).
      SPC_012.P: [T2]
      SPC_014.P: [T2]
      SPC_015.P: [T2]
      SPC_016.P: [T2]
      SPC_017.P: [T2]
      SPC_018.P: [T2]
      SPC_019.P: [T2]
      SPC_020.P: [T2]
      SPC_021.P: [T2]
      SPC_022.P: [T2]
      SPC_023.P: [T2]
      SPC_025.P: [T2]
      SPC_026.P: [T2]
      SPC_027.P: [T2]
      SPC_028.P: [T2]
      SPC_030.P: [T2]
      SPC_031.P: [T2]
      SPC_033.P: [T2]
      SPC_034.P: [T2]
      SPC_038.P: [T2]
      SPC_039.P: [T2]
      SPC_040.P: [T2]             # T2 (T3304) flat-lined; replaced after this cast
      SPC_060.P: [sh1]            # sh1 (M3461) low response; replaced after SPC_061
      SPC_061.P: [sh1]
    flag:                         # usable with caution; carried as flags into products
      SPC_004.P: "ballast tuning: 0.4 m/s, spiking"
      SPC_012.P: "ballast tuning: 1.0 m/s, vibration noise"
      SPC_014.P: "ballast tuning: 0.85 m/s, vibration noise"
      SPC_015.P: "ballast tuning: 0.81 m/s, vibration noise"
      SPC_038.P: "short file (31 min); check whether the cast completed"
    patch:
      # Shear probe serials and sensitivities are already correct in the raw
      # files (setup.cfg was updated aboard at each swap; verified against the
      # Sealog and cal sheets). The shipboard patch changed only pressure coef0
      # (29.48 -> 18.48, an 11 dbar offset fix; on-deck pressure reads 11-12
      # dbar raw and 0-1 dbar patched) and cruise_info. The T2 serial was never
      # updated after the 2026-08-22 swap, so it is corrected here (metadata
      # only: FP07 coefficients are nominal and calibrated in situ).
      method: rsi-tpw patch-config
      author: "Joe"
      cruise_info: {operator: "Rutgers", project: "SPICE", ship: "R/V Falkor (too)"}
      ranges:
        - first: SPC_004.P
          last: SPC_063.P
          P: {coef0: "18.48", coef1: "0.272780", coef2: "-3.8053e-8", cal_date: "2026-05-19"}
        - first: SPC_041.P
          last: SPC_063.P
          T2: {sn: T3301}

conversion:
  # Conversion and dissipation are done by `perturb run` (microstructure-tpw),
  # called per instrument by the driver with a perturb config generated from
  # the `perturb` block below plus instruments.<name>.perturb_overrides.
  # Argument names checked with --help on the pinned commit (decisions.md).
  tool: perturb run
  extra_args: []
  jobs: 0                         # perturb parallel.jobs: 0 = one worker per core (results do not depend on it)
  reuse_cache: true               # keep perturb's output tree; it reprocesses only stages whose parameters
                                  # or inputs changed (false = delete and recompute everything)
  # Positions: the shipboard runs had none (perturb gps.source: nan). Use the
  # ship track built by the cast_log step as a perturb gps csv file.
  gps_source: csv                 # perturb gps.source
  gps_max_time_diff_s: 600        # ASNAP snapshots every 300 s

perturb:
  # Every perturb option, set explicitly. Baseline = the shipboard parameters
  # (vmp*_processed .params_sha256_* files; docs/shipboard_processing.md).
  # Options added after 0.3.1 are set to their 0.3.1-equivalent behaviour
  # where one exists (`fp07.min_corr: 0` disables the new gate); `epsilon.anchor`
  # has no 0.3.1-equivalent setting.
  # files.*, gps.*, hotel.*, netcdf.* are filled in by the driver.
  profiles: {P_min: 0.5, W_min: null, direction: auto, min_duration: 7.0, diagnostics: false}
                                  # W_min null = auto, 0.3 dbar/s for a free-fall VMP
  fp07: {calibrate: true, order: 2, max_lag_seconds: 10, reference: JAC_T,
         must_be_negative: true, reference_interval: null,
         min_corr: 0.0}           # 0 = no correlation gate, as in 0.3.1. With the new
                                  # default 0.5 every VMP5500 profile failed the gate and
                                  # the uncalibrated FP07 kept nominal coefficients (+3 degC;
                                  # decisions.md 2026-10-12)
  ct: {align: true, T_name: JAC_T, C_name: JAC_C}
  bottom: {enable: false, method: vibration, depth_window: 4.0, depth_minimum: 10.0,
           speed_factor: 0.3, median_factor: 1.0, vibration_frequency: 16,
           vibration_factor: 4.0, proximity_bins: 2, height: 0.15,
           fallrate_fraction: 0.9, fallrate_smooth_s: 0.05}
  top_trim: {enable: false, dz: 0.5, min_depth: 1.0, max_depth: 50.0, quantile: 0.6, noise_factor: 2.0}
  epsilon:
    fft_sec: 4.0                  # sensitivity parameter (shipboard 4 s)
    diss_sec: 16.0                # shipboard null = 4 x fft_sec; sensitivity parameter
    overlap_sec: 8.0              # shipboard null = half the window
    fft_length: null
    diss_length: null
    overlap: null
    anchor: top                   # new since 0.3.1; no 0.3.1-equivalent setting
    bbl_diss_sec: null
    bbl_overlap_sec: null
    bbl_extent_sec: null
    goodman: true
    f_AA: 98.0
    f_limit: null                 # null = f_AA
    fit_order: 3
    despike_thresh: 8
    despike_smooth: 0.5
    salinity: null                # viscosity salinity fixed at 35
    epsilon_minimum: 1.0e-13
    T_source: null
    spectral_qc: false            # new since 0.3.1; false = 0.3.1 behaviour
    FM_max: 1.15                  # used only when spectral_qc is true
    var_resolved_min: 0.5         # used only when spectral_qc is true
    pair_policy: keep_both        # new since 0.3.1; keep_both = 0.3.1 behaviour
    pair_limit: 2.7718585822512662
    fom_max: null                 # shipboard: no figure-of-merit cut
    diagnostics: false
  chi:
    enable: true
    fft_sec: 4.0
    diss_sec: 16.0
    overlap_sec: 8.0
    fft_length: null
    diss_length: null
    overlap: null
    fp07_model: single_pole
    goodman: true
    f_AA: 98.0
    use_epsilon: false            # Method 2: chi and epsilon_T from FP07 spectral fits
    fit_method: iterative         # shipboard; MLE (Ruddick et al. 2000) is the first planned change
    spectrum_model: kraichnan
    salinity: null
    mixing_use_qc_fallback: false
    mixing: true
    chi_minimum: 1.0e-13
    fom_max: null
    spectral_qc: true
    diagnostics: false
  ctd: {enable: true, bin_width: 0.5, T_name: JAC_T, C_name: JAC_C, variables: null, method: mean, diagnostics: false}
  speed: {method: pressure, value: null, hotel_var: speed, aoa_deg: 3.0, min_pitch_deg: 5.0,
          speed_cutout: 0.05, tau: null, amplitude_quantile: [1.0, 99.0]}
  qc: {enable: true, drop_action: nan, epsilon_drop_from: [], chi_drop_from: [], rules: {}}
  binning: {method: depth, width: 1.0, aggregation: mean, diss_width: null,
            diss_aggregation: null, chi_width: null, chi_aggregation: null, diagnostics: false}
  stratification: {enable: true, window: 2.0, salinity: null}

segments:
  # Per-window QC on the perturb dissipation windows (epsilon and chi share
  # one window grid). Flags are always computed and reported; `enabled`
  # decides whether later steps drop flagged windows. The shipboard run had
  # no segment QC, so the baseline leaves it off; the `segqc` run applies it.
  # First choices from the baseline data (decisions.md 2026-10-12); all are
  # sensitivity parameters.
  enabled: false
  drop_top_m: 10                  # ship wake / launch: epsilon 1e-5 to 1e-4 and VMP5500
                                  # vibration ~10x deep values above 10 m
  drop_bottom_m: 5                # window centres within 5 m of the profile's max pressure
  min_fall_speed_m_s: 0.2         # shear probes need > 0.2 m/s flow (Rockland)
  max_fall_speed_m_s: 1.5         # sanity bound
  terminal_speed_below_m: 30      # terminal speed = median window speed below this depth
                                  # (reported as speed_ratio; information only)
  speed_cv_max: 0.05              # within-window speed std/mean: 0.12-0.16 in the top 10 m,
                                  # p99 ~0.05 below 20 m (both instruments)
  vibration_highpass_hz: 1.0      # accelerometer high-pass before the per-window rms
  vibration_factor: 3.0           # flag rms > 3 x the profile median (99th pct ~3-5x)

shear_qc:
  # epsilon_shear step: QC of perturb's per-probe shear epsilon, a noise floor
  # per window, and the combined estimate (decisions.md 2026-10-13). Windows
  # are never dropped for being near the floor; they are flagged and carry an
  # upper-bound value. Segment QC follows segments.enabled.
  refit:                          # re-solve epsilon over f_min_hz..K_max (decisions.md 2026-10-13)
    enabled: true                 # false = perturb's epsilon (integration from the lowest wavenumber)
    f_min_hz: 1.0                 # below ~1 Hz the spectra sit 3-5x above Nasmyth; tested 0.5, 1, 2 Hz
    min_points: 5                 # wavenumber points needed in the refit range, else no estimate
    test_f_min_hz: [0.0, 0.5, 1.0, 2.0]   # scripts/test_shear_fmin.py; 0.0 must reproduce perturb
    test_noise_ratio: [2.0, 3.0]  # scripts/test_shear_kmax.py: upper limit where spectrum < ratio x noise
    test_white_band_hz: [20.0, 40.0]   # flat noise level = median of the quiet-window spectrum in this band
  noise_floor:
    method: quietest_windows      # noise spectrum = median frequency spectrum of the quietest windows
    quantile: 0.02                # quietest 2% of windows (per instrument and probe, segment-QC passed)
    factor: 2.0                   # at_floor when epsilon < factor x the window's floor
    policy: clamp                 # epsilon_shear_bounded = max(epsilon_shear, floor); flagged, never dropped
  figure_of_merit:
    max: 1.15                     # ATOMIX (Lueck 2022) limit; flagged per probe
    apply: false                  # not applied until spectra are inspected (decisions.md 2026-10-12)
  var_resolved:
    min: 0.5                      # fraction of Nasmyth variance resolved below K_max
    apply: true
  probe_pair:
    limit: 2.7718585822512662     # |ln(e1/e2)| > ln(limit): probes disagree (perturb epsilon.pair_limit)
    policy: min                   # on disagreement keep the smaller estimate (contamination raises epsilon)
  combine: geometric              # mean of usable probes: geometric (perturb's epsilonMean) or arithmetic
  gallery:                        # spectra figure for inspecting the FM threshold (display only)
    per_panel: 5                  # spectra drawn per epsilon decade x FM bin
    seed: 1

chi_qc:
  # thermistor step: QC of perturb's per-probe FP07 chi and epsilon_T, a noise
  # floor per window from perturb's FP07 electronics noise spectrum, and the
  # combined estimate (decisions.md 2026-10-13). Windows near the floor are
  # flagged, never dropped. Segment QC follows segments.enabled; probe
  # exclusions come from instruments.<name>.exclude_probes.
  k_max_ratio:
    min: 0.5                      # K_max/kB below this: chi mostly extrapolated (perturb's soft-QC value)
    apply: true
  fom:
    band: 1.15                    # observed/model variance ratio outside [1/band, band] (perturb's value)
    apply: false                  # flagged only until spectra are inspected
  noise_floor:
    factor: 2.0                   # at_floor when chi < factor x the window's floor
    policy: clamp                 # chi_bounded = max(chi, floor); flagged, never dropped
  probe_pair:
    limit: 2.7718585822512662     # |ln(chi1/chi2)| > ln(limit): probes disagree (same limit as shear)
    policy: min                   # keep the smaller estimate on disagreement (noise and spikes raise chi)
  combine: geometric              # mean of usable probes (perturb's chiMean is geometric)
  epsilon_T:
    k_max_ratio_min: 1.6          # epsilon_T used only where K_max/kB >= this (roll-off resolved);
                                  # below it epsilon_T/shear is 2-6x (decisions.md 2026-10-13)
  gallery:
    per_panel: 5
    seed: 1

hydrography:
  # Background stratification per profile (TEOS-10): CT, SA, N2, T_z, S_z,
  # R_rho, Turner angle on a 1 m grid and at every dissipation window centre.
  # Gradients are linear fits over gradient_smoothing_m (z positive up).
  # Validated against the ship CTD (decisions.md 2026-10-12).
  gradient_smoothing_m: 10        # key sensitivity parameter (runs strat5m, strat25m)
  bin_m: 1.0
  min_fit_fraction: 0.6           # fraction of bins needed within the fit window
  ship_ctd:
    sensor: 1                     # temp1/salt1 (sensor 2 for a check)
    match_max_km: 15
    match_max_hours: 6
    ts_bin_degC: 0.05             # ship T-S relation: median SA in CT bins
  own_ts:                         # salinity_source own_ts (decisions.md 2026-10-13)
    sbe_temperature: SBT1         # Sea-Bird T and C used to fit the cast's T-S relation
    sbe_conductivity: SBC1
    fp07: T1                      # temperature the relation is evaluated at (probe-tip depth)
    bin_degC: 0.5                 # median SA in CT bins; 0.25 still noisy (0.006 g/kg at 1 m)
    smooth_bins: 3                # running mean over bins (~1.5 degC); sets the R_rho resolution
    bad_cell_check:               # ship-free: compare each profile's T-S with the instrument median
      ct_min_degC: 5.5            # cold range where T-S varies little across the cruise (MAD 0.01-0.024 g/kg)
      ct_max_degC: 8.0
      min_points: 3               # T-S nodes needed in the range, else unchecked
      max_offset_g_kg: 0.1        # median offset above this: bad cell (SPC_041 +0.26, SPC_045 +0.18; next +0.07)
    ship_check:                   # QC flag only; the ship T-S replaces nothing except bad-cell profiles
      max_diff_g_kg: 0.15         # |own - ship| T-S relation above this: window flagged ts_disagrees_with_ship
  # Perturb's window-scale N2 and dTdz are not used: for the VMP5500 they are
  # ~4.5x and ~0.4x the TEOS-10 values.

regimes:
  # regimes step (CLAUDE.md step 6; decisions.md 2026-10-14). Labels every
  # dissipation window: Turner class, staircase position per detection method,
  # buoyancy Reynolds number. Interfaces and layers are never pooled downstream.
  turner_finger_min_deg: 45
  turner_finger_strong_deg: 72
  turner_smoothing_m: 25          # Turner class from linear fits over this scale (hydrography 10 m values kept);
                                  # VMP5500 10 m R_rho is unbiased but noisy (decisions.md 2026-10-13)
  window_label_fraction: 0.667    # window is interface (layer) when this fraction of its extent is interface
                                  # (layer); in a staircase but below it for both: straddles
  examples:                       # profiles drawn in the label figure: instrument, profile stem, p range (dbar)
    - [vmp5500, SPC_031_prof001, 250, 450]
    - [vmp5500, SPC_033_prof001, 150, 550]
    - [vmp250, data_0133_prof002, 150, 255]
  staircase:
    # Interface/layer labels from each method are kept side by side in the
    # products and compared; none is privileged until the comparison is done.
    # vdb2021 keeps the published thresholds; rollo2022 is tuned to these
    # profiles (decisions.md 2026-10-14). The published values and the staircase
    # percentages they produce elsewhere are a reference, not a benchmark for
    # this dataset.
    # Both published methods run through Rollo's implementation
    # (thermohalinesteps.detect_staircases.classify_staircase, pinned in
    # requirements.txt); keys below are its arguments. Its defaults equal the
    # van der Boog et al. (2021) values. av_window only sets the 200 dbar running
    # mean used for alpha and beta (density units for the mixed-layer test); the
    # Turner angle that classifies steps uses a 50 dbar mean hardcoded in the
    # package. For the VMP5500 (salinity from its own T-S relation) the two
    # methods give identical labels.
    methods: [vdb2021, rollo2022]
    vdb2021:
      # van der Boog et al. (2021), ESSD 13, 43-61, doi:10.5194/essd-13-43-2021:
      # mixed layers must pass the temperature, salinity and density criteria.
      # Paper parameters without a counterpart in the code (not applied):
      # interface_max_extrema 2, min_interfaces 2, sigma_reference 1000 dbar (code uses sigma1).
      grid_dbar: 1.0
      ml_grad: 0.0005                        # kg m-3 dbar-1
      ml_density_difference: 0.005           # kg m-3
      av_window: 200                         # dbar; alpha/beta background only (sensitivity run stair_av100)
      interface_max_height: 30               # dbar
      layer_height_ratio: 1
      temp_flag_only: false
    rollo2022:
      # Rollo et al. (2022), Geosci. Instrum. Method. Data Syst. 11, 359-373,
      # doi:10.5194/gi-11-359-2022. Code: github.com/callumrollo/thermohaline-steps
      # (GPL-3.0). Mixed layers flagged by temperature only (FP07 resolves steps).
      # Tuned: ml_grad 0.002 (published 0.0005) captures the visually evident
      # steps whose layers keep a weak residual gradient; ml_density_difference
      # has no effect over 0.005-0.04 (scripts/test_staircase_thresholds.py).
      grid_dbar: 1.0                         # input must be evenly spaced in pressure
      ml_grad: 0.002                         # kg m-3 dbar-1 (published 0.0005; sensitivity run stair_mlgrad001)
      ml_density_difference: 0.005           # kg m-3
      av_window: 200                         # dbar
      interface_max_height: 30               # dbar
      layer_height_ratio: 1                  # max mixed layer / gradient layer height ratio
      temp_flag_only: true
    test_grid:                    # scripts/test_staircase_thresholds.py (rollo2022 settings otherwise)
      ml_grad: [0.0005, 0.001, 0.002]
      ml_density_difference: [0.005, 0.01, 0.02, 0.04]
    ml:
      # Labels from an external machine learning classifier (intern project),
      # read from a file and compared with the published methods. Expected
      # columns: instrument, file, profile, depth_top_m, depth_bottom_m,
      # label (layer | interface), model_name, model_version.
      enabled: false
      labels_path: null

double_diffusion:
  flux_coefficient: 0.2           # Gamma used for chi_expected
  epsilon_source: shear           # shear or thermistor
  flux_ratio_gamma: 0.65          # sensitivity parameter
  average_over: station           # average all valid profiles in a station group
  min_profiles_per_average: 3     # bins with fewer profiles are reported, flagged
  depth_bin_m: 25                 # baseline; 10 m in the bin10m sensitivity run
  exclude_weakest_n2_percent: 10  # robustness check: repeat with the weakest N2 decile removed
  station_groups: [process_station, transect]   # cast_log station names; casts outside a station are `transect`
  pool_free_fall: true            # also test all free-fall casts of an instrument together ("all free fall")
  control_max_turner_deg: 30      # control: -45 < Tu < 30 (doubly stable, away from the 45 deg finger boundary)
  control_depth_range_dbar:       # control windows (also need T_z > 0); reaches above the salinity maximum (~105 dbar)
    vmp250: [20, 300]
    vmp5500: [20, 1000]
  re_b_bins: [0, 3, 10, 30, 100, 1000000]   # Re_b bins for the finger vs control comparison
  excess_control_group: all free fall   # control used to calibrate R by Re_b (per instrument)
  excess_min_control_windows: 10  # Re_b bins with fewer control windows are left out of the excess
  gm:                             # Garrett-Munk reference level (Gregg 1989; Kunze et al. 2006 form); verify before publication
    K0_m2_s: 5.0e-6               # canonical diffusivity at N0 and 30 deg latitude (Gamma 0.2 implied)
    N0_rad_s: 5.24e-3             # 3 cph
    f_ref_lat_deg: 30
  depth_range_dbar:               # windows tested (P_mean), per instrument; above ~150 dbar is not staircase water
    vmp250: [150, 300]            # to the bottom of the casts (~180-270 dbar)
    vmp5500: [150, 1000]          # full deep casts (was 550: ship CTD validation depth, not a physical limit)

uncertainty:
  bootstrap_samples: 1000
  random_seed: 20260812

sensitivity_runs:
  # Each entry is its own run, reported as a difference from the baseline.
  - name: segqc                   # planned change: apply segment QC
    set: {segments.enabled: true}
  - name: bin10m
    set: {double_diffusion.depth_bin_m: 10}
  - name: strat5m
    set: {hydrography.gradient_smoothing_m: 5}
  - name: strat25m
    set: {hydrography.gradient_smoothing_m: 25}
  - name: fft2_diss16             # 2 s FFT, 16 s windows: 15 FFTs per window (Goodman factor 1.16 vs 1.41)
    set: {perturb.epsilon.fft_sec: 2.0, perturb.chi.fft_sec: 2.0}
  - name: fft2_diss8              # 2 s FFT, 8 s windows (~6 m): resolves staircase interfaces, 7 FFTs as baseline
    set: {perturb.epsilon.fft_sec: 2.0, perturb.epsilon.diss_sec: 8.0, perturb.epsilon.overlap_sec: 4.0,
          perturb.chi.fft_sec: 2.0, perturb.chi.diss_sec: 8.0, perturb.chi.overlap_sec: 4.0}
  - name: fft2_diss8_mle           # analysis run (decisions.md 2026-10-13): 2 s / 8 s windows, chi by MLE
    set: {perturb.epsilon.fft_sec: 2.0, perturb.epsilon.diss_sec: 8.0, perturb.epsilon.overlap_sec: 4.0,
          perturb.chi.fft_sec: 2.0, perturb.chi.diss_sec: 8.0, perturb.chi.overlap_sec: 4.0,
          perturb.chi.fit_method: mle}
  - name: stair_mlgrad001          # rollo2022 mixed-layer gradient threshold 0.001, on the analysis settings
    set: {perturb.epsilon.fft_sec: 2.0, perturb.epsilon.diss_sec: 8.0, perturb.epsilon.overlap_sec: 4.0,
          perturb.chi.fft_sec: 2.0, perturb.chi.diss_sec: 8.0, perturb.chi.overlap_sec: 4.0,
          perturb.chi.fit_method: mle, regimes.staircase.rollo2022.ml_grad: 0.001}
  - name: stair_av100              # staircase background window 100 dbar (alpha/beta only), on the analysis settings
    set: {perturb.epsilon.fft_sec: 2.0, perturb.epsilon.diss_sec: 8.0, perturb.epsilon.overlap_sec: 4.0,
          perturb.chi.fft_sec: 2.0, perturb.chi.diss_sec: 8.0, perturb.chi.overlap_sec: 4.0,
          perturb.chi.fit_method: mle, regimes.staircase.vdb2021.av_window: 100,
          regimes.staircase.rollo2022.av_window: 100}
  - name: fft2_diss8_mle_dp        # FP07 response test: double-pole transfer, fixed tau 3 ms (Goto et al. 2016)
    set: {perturb.epsilon.fft_sec: 2.0, perturb.epsilon.diss_sec: 8.0, perturb.epsilon.overlap_sec: 4.0,
          perturb.chi.fft_sec: 2.0, perturb.chi.diss_sec: 8.0, perturb.chi.overlap_sec: 4.0,
          perturb.chi.fit_method: mle, perturb.chi.fp07_model: double_pole}

products:
  # Final exported products for use outside this repository. Layout and
  # variables are specified in docs/products.md.
  format: netcdf4
  conventions: "CF-1.13, ACDD-1.3"
  product_version: "0.1"          # bump on any change to variables or methods
  depth_bin_m: 1.0                # binned profiles; matches shipboard binning
  creator_name: "Joe Gradone"
  creator_email: "joe@gradone.com"
  institution: "Rutgers University"
  license: "CC-BY-4.0"            # data products; the code is MIT
